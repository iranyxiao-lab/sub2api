name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  edge-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test Cloudflare origin security scripts
        run: |
          /bin/bash deploy/tests/cloudflare-origin-guard-test.sh
          /bin/bash deploy/tests/cloudflare-trusted-proxy-test.sh
          /bin/sh deploy/tests/cloudflare-caddy-policy-test.sh
          /bin/sh deploy/tests/cloudflared-service-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
      - name: Validate Caddy 2.6.2 configurations
        run: |
          docker run --rm \
            -v "$PWD/deploy/cloudflare:/etc/sub2api-cloudflare:ro" \
            caddy:2.6.2 caddy validate \
            --config /etc/sub2api-cloudflare/Caddyfile.cloudflare \
            --adapter caddyfile
          docker run --rm \
            -v "$PWD/deploy/cloudflare:/etc/sub2api-cloudflare:ro" \
            caddy:2.6.2 caddy validate \
            --config /etc/sub2api-cloudflare/Caddyfile.tunnel \
            --adapter caddyfile

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
